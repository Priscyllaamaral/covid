<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantas vezes você pegou COVID?</title>
<style>
  :root {
    --bg1: #1a1040; --bg2: #4a1d7a; --bg3: #0e7490;
    --card: rgba(255,255,255,.12); --text: #fff; --muted: #d8cdf5;
    --accent: #22d3ee; --accent2: #a855f7;
    --bubble-in: #e9e9ef; --bubble-text: #111;
    --phone: #0b0b12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-size: 200% 200%;
    animation: bgMove 14s ease infinite;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow-x: hidden;
  }
  @keyframes bgMove { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .floaty { position: fixed; font-size: 2.2rem; opacity: .15; animation: float 9s ease-in-out infinite; pointer-events: none; user-select: none; }
  .floaty:nth-child(1){ top: 8%; left: 8%; }
  .floaty:nth-child(2){ top: 70%; left: 12%; animation-delay: -3s; font-size: 3rem; }
  .floaty:nth-child(3){ top: 15%; right: 10%; animation-delay: -5s; font-size: 3.4rem; }
  .floaty:nth-child(4){ bottom: 8%; right: 14%; animation-delay: -1s; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-24px) rotate(15deg); } }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    background: var(--card);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 28px; padding: 36px 28px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,.4);
    animation: pop .7s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.85) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  .emoji { font-size: 3.6rem; display: inline-block; animation: wobble 3s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) scale(1.08); } }

  h1 { margin: 12px 0 8px; font-size: 1.7rem; line-height: 1.25; }
  p.sub { color: var(--muted); margin-bottom: 26px; font-size: .98rem; }

  .field { position: relative; margin-bottom: 18px; }
  input[type=number] {
    width: 100%; padding: 18px; font-size: 1.6rem; font-weight: 700; text-align: center;
    color: var(--text); background: rgba(0,0,0,.25);
    border: 2px solid rgba(255,255,255,.25); border-radius: 18px; outline: none;
    transition: border-color .2s, box-shadow .2s;
    -moz-appearance: textfield; appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input::placeholder { color: rgba(255,255,255,.4); font-weight: 400; font-size: 1.1rem; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(34,211,238,.25); }
  .error { color: #fda4af; font-size: .9rem; min-height: 1.2em; margin-bottom: 8px; }

  button.send {
    width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 700; color: #fff;
    border: none; border-radius: 18px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    box-shadow: 0 10px 25px rgba(168,85,247,.45);
    transition: transform .15s, box-shadow .15s;
  }
  button.send:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(34,211,238,.45); }
  button.send:active { transform: scale(.97); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(5,3,20,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .phone {
    width: 100%; max-width: 360px; max-height: 92vh;
    background: var(--phone); border-radius: 42px; padding: 12px;
    border: 3px solid #3a3a4a;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 6px rgba(255,255,255,.05);
    transform: translateY(60px) scale(.9); transition: transform .45s cubic-bezier(.2,1.3,.4,1);
  }
  .overlay.open .phone { transform: none; }

  .screen { background: #f2f2f7; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; min-height: 480px; max-height: calc(92vh - 30px); }
  .notch { width: 90px; height: 22px; background: var(--phone); border-radius: 0 0 16px 16px; margin: 0 auto; }
  .status { display: flex; justify-content: space-between; padding: 4px 22px 0; font-size: .75rem; font-weight: 600; color: #111; margin-top: -18px; }
  .chat-header { text-align: center; padding: 14px 10px 10px; border-bottom: 1px solid #d8d8e0; background: #fafafc; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 4px; display: grid; place-items: center; font-size: 1.5rem; background: linear-gradient(135deg, var(--accent2), var(--accent)); }
  .chat-header b { display: block; color: #111; font-size: .85rem; }
  .chat-header small { color: #7b7b88; font-size: .7rem; }

  .chat { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .time { text-align: center; font-size: .68rem; color: #8a8a96; margin-bottom: 4px; }

  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 20px; font-size: .93rem; line-height: 1.4;
    color: var(--bubble-text); background: var(--bubble-in); align-self: flex-start;
    border-bottom-left-radius: 6px; white-space: pre-line;
    animation: bubbleIn .4s cubic-bezier(.2,1.4,.4,1) both;
  }
  .bubble.me { align-self: flex-end; color: #fff; background: linear-gradient(135deg, #3b82f6, #6366f1); border-bottom-left-radius: 20px; border-bottom-right-radius: 6px; }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(14px) scale(.8); } to { opacity: 1; transform: none; } }

  .typing { align-self: flex-start; background: var(--bubble-in); padding: 12px 16px; border-radius: 20px; border-bottom-left-radius: 6px; display: flex; gap: 5px; animation: bubbleIn .3s both; }
  .typing span { width: 8px; height: 8px; background: #9a9aa8; border-radius: 50%; animation: dot 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay: .2s; } .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes dot { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-6px); opacity: 1; } }

  .delivered { align-self: flex-end; font-size: .65rem; color: #8a8a96; margin-top: -4px; }

  .close {
    margin: 10px 12px 14px; padding: 12px; border: none; border-radius: 16px; cursor: pointer;
    font-weight: 700; font-size: .95rem; color: #fff;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    transition: transform .15s;
  }
  .close:hover { transform: scale(1.03); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <span class="floaty">🦠</span><span class="floaty">😷</span><span class="floaty">💉</span><span class="floaty">🦠</span>

  <main class="card">
    <div class="emoji">🦠</div>
    <h1>Quantas vezes você já pegou COVID?</h1>
    <p class="sub">Responda com sinceridade… o vírus está de olho! 👀</p>

    <div class="field">
      <input type="number" id="qtd" min="0" step="1" placeholder="Digite um número" inputmode="numeric" autofocus>
    </div>
    <div class="error" id="erro"></div>
    <button class="send" id="enviar">Enviar resposta 🚀</button>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Mensagem recebida">
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <div class="status"><span id="hora">9:41</span><span>📶 🔋</span></div>
        <div class="chat-header">
          <div class="avatar">🥳</div>
          <b>Priscylla Amaral</b>
          <small>Online</small>
        </div>
        <div class="chat" id="chat"></div>
        <button class="close" id="fechar">Fechar</button>
      </div>
    </div>
  </div>

<script>
  const R3 = "Tá bom, já entendi que você quer ganhar de mim! KKKK só peguei 3 vezes.";

  const respostas = {
    0: ["Sorte é seu primeiro nome ou você está vivendo em uma dimensão onde a pandemia nunca aconteceu? Eu peguei incríveis 3 vezes. 👽🦠😎"],
    1: ["Que sorte! Peguei 2 vezes a mais que você. 😂"],
    2: ["Quase empatamos! Peguei só uma vez a mais. Kkk"],
    3: ["Somos gêmeos! Kkkkk Eu também! 🤝"],
    4: ["Opa! Você me superou! Peguei só 3. 😅"],
    5: ["Cinco vezes??", R3, "Já passou do meu recorde! Tá colecionando COVID? 😂"],
    6: ["Seis vezes?!", R3, "Você tem assinatura premium do vírus? 🤣"],
    7: ["Sete vezes??", "Já são sete temporadas dessa série? Meu Deus! 😳", R3],
    8: ["Oito vezes??", R3, "O vírus já deve conhecer você pelo nome! Kkkkk"],
    9: ["Nove vezes??", R3, "Quase uma dezena! Você não cansa de encontrar esse vírus? 😂"],
    10: ["DEZ VEZES?!", R3, "Isso já virou relacionamento sério! 🤣"],
    11: ["Onze vezes??", R3, "Você desbloqueou uma conquista que eu nem sabia que existia! 🏆"],
    12: ["Uma vez por mês?", R3, "Espero que não tenha sido tudo no mesmo ano! Kkkkk"],
    13: ["Treze vezes??", R3, "Nem o azar explica isso! 😭"],
    14: ["Catorze vezes??", R3, "Você e o coronavírus têm um compromisso recorrente? 😂"],
    15: ["Quinze?!", R3, "Acho que você já pode escrever um livro sobre essa experiência!"],
    16: ["Dezesseis??", R3, "O vírus já deve mandar mensagem perguntando quando vocês vão se encontrar novamente! 🤣"],
    17: ["Dezessete??", R3, "Você está competindo com o próprio sistema imunológico? Kkkkk"],
    18: ["Dezoito vezes?!", R3, "Eu tenho três e já acho muito! 😳"],
    19: ["Dezenove??", R3, "Falta pouco para chegar a vinte! Isso é um recorde pessoal ou uma provocação? 😂"],
    20: ["VINTE VEZES?!", R3, "Parabéns, você zerou o modo COVID! 🏆🤣"]
  };
  const respostaMais20 = ["Você está falando sério ou só quer testar os limites do meu software? KKKKK Não acredito! Eu só peguei 3 vezes. 😂"];

  const $ = id => document.getElementById(id);
  const input = $("qtd"), erro = $("erro"), overlay = $("overlay"), chat = $("chat");
  let timers = [];

  function limpaTimers() { timers.forEach(clearTimeout); timers = []; }

  function addBubble(texto, eu = false) {
    const b = document.createElement("div");
    b.className = "bubble" + (eu ? " me" : "");
    b.textContent = texto;
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  function enviar() {
    const raw = input.value.trim();
    const n = Number(raw);
    if (raw === "" || !Number.isInteger(n) || n < 0) {
      erro.textContent = "Digite um número inteiro, de 0 para cima. 🙂";
      input.focus();
      return;
    }
    erro.textContent = "";

    const msgs = n > 20 ? respostaMais20 : respostas[n];
    const agora = new Date();
    const hh = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    $("hora").textContent = hh;

    limpaTimers();
    chat.innerHTML = "";
    const t = document.createElement("div");
    t.className = "time"; t.textContent = "Hoje " + hh;
    chat.appendChild(t);

    overlay.classList.add("open");

    // mensagem do usuário
    timers.push(setTimeout(() => {
      addBubble(n === 1 ? "Eu peguei 1 vez" : `Eu peguei ${n} vezes`, true);
      const d = document.createElement("div");
      d.className = "delivered"; d.textContent = "Entregue";
      chat.appendChild(d);
    }, 500));

    // respostas com "digitando..."
    let delay = 1200;
    msgs.forEach(m => {
      timers.push(setTimeout(() => {
        const typing = document.createElement("div");
        typing.className = "typing";
        typing.innerHTML = "<span></span><span></span><span></span>";
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;
        timers.push(setTimeout(() => { typing.remove(); addBubble(m); }, 900));
      }, delay));
      delay += 1100 + Math.min(m.length * 8, 900);
    });
  }

  function fechar() {
    overlay.classList.remove("open");
    limpaTimers();
    input.value = "";
    input.focus();
  }

  $("enviar").addEventListener("click", enviar);
  input.addEventListener("keydown", e => { if (e.key === "Enter") enviar(); });
  $("fechar").addEventListener("click", fechar);
  overlay.addEventListener("click", e => { if (e.target === overlay) fechar(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });
</script>
</body>
</html>
